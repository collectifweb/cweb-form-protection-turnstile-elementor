<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500" role="img" aria-label="CWeb Form Protection with Turnstile for Elementor Forms">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#0c1428"/>
    </linearGradient>
    <linearGradient id="bshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#e35f00"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bbg)"/>
  <!-- subtle accent bar -->
  <rect x="0" y="0" width="1544" height="6" fill="#f6821f"/>
  <!-- Shield emblem on the left -->
  <g transform="translate(150 110)">
    <path d="M140 0 L260 46 V152 C260 226 207 283 140 311 C73 283 20 226 20 152 V46 Z" fill="url(#bshield)"/>
    <path d="M86 158 L124 196 L200 116" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(520 0)" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="215" font-size="84" font-weight="700" letter-spacing="-1">CWeb Form Protection</text>
    <text x="2" y="285" font-size="50" font-weight="400" fill="#c7d0e4">with Turnstile for Elementor Forms</text>
    <text x="2" y="355" font-size="34" font-weight="400" fill="#8a96b3">Per-form Cloudflare Turnstile — protect only the forms you choose</text>
  </g>
</svg>
